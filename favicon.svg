      <stop offset="100%" stop-color="#C8280A"/>
    </linearGradient>
    <radialGradient id="gloss" cx="50%" cy="0%" r="70%" fx="50%" fy="0%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
